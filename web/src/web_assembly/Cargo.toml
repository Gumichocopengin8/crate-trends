[package]
name = "web_assembly"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
js-sys = "0.3.80"
web-sys = { "version" = "0.3.80", features = ['console'] }
wasm-bindgen = "0.2.103"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# TODO: wordaround to avoid `wasm-opt` fail
# TODO: remove it when its fixed
# TODO: https://github.com/drager/wasm-pack/issues/1441#issuecomment-2886461752
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
